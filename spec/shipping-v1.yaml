      description: >
        Lists your monthly invoices, newest first. Invoices show VAT on the delivery fee only; the service charge
        carries no VAT.

        An invoice is issued on the 1st of each month for the previous month. If it becomes overdue, the account goes on
        hold:

        new bookings get `403 ACCOUNT_ON_HOLD`, while deliveries already moving carry on.


        Each invoice has a `number` (`RDS-2026-000123`; `TEST-2026-000123` in test mode, numbered separately, with no
        gaps). `amount_due` is what is still owed after payments and credits. A `void` invoice was cancelled by Reeds and
        owes nothing; a corrected one is issued in its place with a new number. A charge and its refund in the same month
        cancel out, and a month that nets to zero or less issues no invoice: it carries forward.
      parameters:
        - name: status
          in: query
          description: Only invoices with this status.
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
      responses:
        '200':
          description: A page of invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListEnvelope'
              example:
                status: success
                data:
                  - id: inv_6Gc4Yt8N
                    number: RDS-2026-000123
                    livemode: true
                    status: issued
                    period: 2026-09
                    delivery_count: 412
                    delivery_fees: 98400000
                    vat: 7380000
                    service_charges: 2420000
                    discounts: 0
                    adjustments: 0
                    total: 108200000
                    amount_paid: 0
                    amount_credited: 0
                    amount_due: 108200000
                    currency: NGN
                    issued_at: '2026-10-01T06:00:00+01:00'
                    due_at: '2026-10-15T23:59:59+01:00'
                    paid_at: null
                    voided_at: null
                has_more: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
