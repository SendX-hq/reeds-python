  /wallet/fund:
    post:
      operationId: fundWallet
      tags:
        - Wallet
      summary: Fund the wallet
      description: >
        Starts a top-up and returns a Paystack `payment_url` for the payer to open. **Requires an `Idempotency-Key`
        header.** Live mode only:

        in test mode use `POST /sandbox/wallet/fund` (a test token gets `409 ACTION_NOT_ALLOWED`). Your credentials act
        for the account, not for a person, so any live credentials can start a top-up; Paystack sends the receipt to the
        account Owner's email. Invoice accounts have no wallet to fund (`409 ACTION_NOT_ALLOWED`).


        Reeds pays Paystack's fee, so the wallet is credited the full amount paid. The credit lands when payment
        completes and `wallet.funded` fires, with the same `reference`.

        Dashboard deliveries waiting on `FUND_WALLET` are booked automatically once the money lands.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundWalletRequest'
            example:
              amount: 5000000
      responses:
        '201':
          description: Top-up started.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundWalletEnvelope'
              example:
                status: success
                data:
                  amount: 5000000
                  currency: NGN
                  payment_url: https://checkout.paystack.com/2x4k9d7m1q
                  reference: fund-8f3a1c7e5b2d4a6f9e0c
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            A test token (use `POST /sandbox/wallet/fund`), an invoice account, or the same idempotency key still
            running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                test_mode:
                  value:
                    status: failed
                    error:
                      code: ACTION_NOT_ALLOWED
                      message: 'In test mode use POST /sandbox/wallet/fund: it credits the sandbox wallet at once.'
                      doc_url: https://developer.getreeds.co/errors/ACTION_NOT_ALLOWED
                      fields: []
                invoice_account:
                  value:
                    status: failed
                    error:
                      code: ACTION_NOT_ALLOWED
                      message: This account is billed by invoice, so it has no wallet to fund.
                      doc_url: https://developer.getreeds.co/errors/ACTION_NOT_ALLOWED
                      fields: []
                request_in_progress:
                  value:
                    status: failed
                    error:
                      code: REQUEST_IN_PROGRESS
                      message: A request with this Idempotency-Key is still running. Retry shortly.
                      doc_url: https://developer.getreeds.co/errors/REQUEST_IN_PROGRESS
                      fields: []
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
