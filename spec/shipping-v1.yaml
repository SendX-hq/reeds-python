  /webhooks/test:
    post:
      operationId: sendTestWebhook
      tags:
        - Webhooks
      summary: Send a test webhook
      description: >
        Sends a test event to the webhook endpoint you saved for the current mode (Dashboard, then Developers). The
        event is signed

        like a real one, with its own `evt_` id, so you can check your signature verification and your handler end to
        end.

        Returns `422` if no endpoint is saved for the mode, or for a `type` that isn't an event type, and `409` while
        Reeds has turned the endpoint off (nothing is sent to it then; contact support). `sent` is `true` when your
        endpoint answered `2xx` within 10 seconds. A test event is in the dashboard's event log like a real one, but it
        is sent once and never retried. At most 10 test events a minute per client.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestWebhookRequest'
            example:
              type: delivery.status_changed
      responses:
        '200':
          description: The event was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestWebhookEnvelope'
              example:
                status: success
                data:
                  event_id: evt_4fQ7Hd2X
                  type: delivery.status_changed
                  sent: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Reeds turned the endpoint off. Nothing is sent to it, test events included, until Reeds turns it back on;
            contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: failed
                error:
                  code: ACTION_NOT_ALLOWED
                  message: Reeds turned this webhook endpoint off. Contact Reeds support to turn it back on.
                  doc_url: https://developer.getreeds.co/errors/ACTION_NOT_ALLOWED
                  fields: []
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sandbox/wallet/fund:
