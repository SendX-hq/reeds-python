  /deliveries:
    post:
      operationId: createDelivery
      tags:
        - Deliveries
      summary: Create a delivery
      description: >
        Books the delivery a quote priced. **Requires an `Idempotency-Key` header.**


        Send `quote_id` (an unexpired, unused quote from `POST /quotes`). The delivery is booked, the wallet is debited
        (or the delivery is added to the month's invoice), and the status is `scheduled`. The tracking code is returned
        at once; Reeds sets the delivery up with its riders and hubs within seconds. If Reeds can't set it up within 30
        minutes, the delivery is cancelled with a full refund and `delivery.cancelled` fires with the reason
        `processing_failed`.


        - Booking charges at once: if the wallet doesn't cover it you get `402 INSUFFICIENT_BALANCE` (`402
        CREDIT_LIMIT_REACHED` for an invoice account), nothing is created and the quote stays unused, so fund the wallet
        and retry with the same `Idempotency-Key`.

        - The addresses, package and pickup date are the quote's. To change any of them, quote again.

        - `pickup_instructions` and `dropoff_instructions` are for this delivery only (the address's own `notes` stay on
        the address); the rider sees them first. Change them later with `PATCH /deliveries/{id}`.

        - Send `ready: false` if the item is not packed yet. The delivery is charged and gets its tracking code, but
        waits in `requires_action` with `MARK_READY` until you call `POST /deliveries/{id}/ready`, and the pickup is
        scheduled from that moment.

        - Platform accounts must send `shipper` (`422 SHIPPER_REQUIRED` without it). Business accounts leave it out;
        it is ignored if sent.

        - What Reeds carries was checked when the quote was made: parcels up to 100 kg with no side longer than 120 cm,
        and never cash, weapons, drugs, hazardous goods or perishable food (`422 PARCEL_TOO_HEAVY`, `PARCEL_TOO_LARGE`
        and `PROHIBITED_ITEM` are answered by `POST /quotes`).

        - The declared value is accepted at any amount. Reeds covers loss or damage up to the declared value, at most
        ₦50,000 per delivery; `liability` on the delivery says what is covered.

        - Nothing waits forever: a booked delivery that is not marked ready within 7 days is cancelled with the reason
        `expired` and refunded in full. You are reminded on day 3 and day 6 through `delivery.expiring`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookFromQuote'
            examples:
              book_from_quote:
                summary: Book from a quote
                value:
                  quote_id: qt_2bX9Wn4K
                  reference: ORDER-10045
                  pickup_instructions: Call on arrival
                  metadata:
                    store_id: '42'
              book_from_quote_platform:
                summary: Book from a quote (platform)
                value:
                  quote_id: qt_2bX9Wn4K
                  reference: ORDER-10045
                  ready: false
                  shipper:
                    business_name: Tola Fabrics
                    phone: '08051234567'
                    merchant_id: m_8812
      responses:
        '201':
          description: Delivery booked (`scheduled`, or `requires_action` with `MARK_READY` when `ready` is false).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
