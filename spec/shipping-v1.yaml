      summary: Book a priced delivery
      description: >
        Books a priced delivery that shows the `BOOK` required action and charges it (wallet debit, or added to the
        month's invoice). **Requires an `Idempotency-Key` header.** No request body.


        A delivery booked through the API from a quote is charged at once, so it never waits here: this is for a
        delivery your team created in the dashboard and left unbooked.


        A delivery that is not yet priced returns `409 ACTION_NOT_ALLOWED`. If the wallet is short you get `402
        INSUFFICIENT_BALANCE` (an invoice account at its limit, `402 CREDIT_LIMIT_REACHED`); fund the wallet and retry
        with the same `Idempotency-Key`.


        A delivery that isn't paid for is never ready for pickup, so it was saved with `ready: false`. Once booked it
        waits in `requires_action` with `MARK_READY`: call `POST /deliveries/{id}/ready` when the item is packed.
