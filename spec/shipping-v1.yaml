# Reeds Shipping API v1: public contract. Generated examples are flattened, no YAML anchors.
openapi: 3.1.0
info:
  title: Reeds Shipping API
  version: 1.0.0
  summary: Book, track and pay for Reeds deliveries from your own system.
  description: >
    The Reeds Shipping API lets online stores, marketplaces, ERPs and logistics platforms book Reeds deliveries

    from their own systems. Get a price quote for two addresses, book the delivery with that quote, then

    follow it through webhooks until it is delivered.


    **Base URL:** `https://api.getreeds.co/shipping/v1`. The token endpoint lives at
    `https://api.getreeds.co/oauth/token`.


    ## Authentication


    Every call carries a bearer access token. Exchange your client id and client secret (Dashboard, then Developers)

    at `POST /oauth/token` using the OAuth 2.0 client credentials grant, then send `Authorization: Bearer
    <access_token>`

    on every request. A token lasts one hour; an expired token gets `401 TOKEN_EXPIRED`. The credentials decide the
    mode:

    `rci_test_` and `rcs_test_` credentials act on test data, `rci_live_` and `rcs_live_` credentials on live data, and
    every

    object carries `livemode: true|false`.


    ## Conventions


    - **JSON and snake_case.** Requests and responses are JSON with `snake_case` field names.

    - **Envelopes.** Success is `{"status": "success", "data": ...}`; lists add `has_more`. Failure is
      `{"status": "failed", "error": {"code", "message", "doc_url", "fields"}}`. Branch on the HTTP status and `error.code`, never on `message`.
    - **Money** is an integer in kobo with `currency: "NGN"`. NGN 2,800.00 is `280000`.

    - **IDs** are opaque prefixed strings: `adr_` address, `qt_` quote, `dlv_` delivery, `txn_` wallet transaction,
    `inv_` invoice, `evt_` webhook event. Real ids are longer than the examples here, so allow 64 characters.

    - **Times** are ISO 8601 with the Lagos offset (`+01:00`). Dates are `YYYY-MM-DD`.

    - **Pagination** is by cursor: `limit` (maximum 100) and `starting_after`. Lists are newest first.

    - **Idempotency.** Send an `Idempotency-Key` header on every request that creates a delivery or moves money.

    - **Limits and busy answers.** Over a rate limit, or once the account has used its daily allowance for address
    lookups and pricing, a request gets `429 RATE_LIMITED` with `Retry-After`. When Reeds is overloaded it sheds load:
    any request can get `503 SERVICE_UNAVAILABLE` with `Retry-After`, and nothing was done. In both cases wait the
    `Retry-After` seconds and send the same request again, with the same `Idempotency-Key`.

    - **Versioning.** Reeds adds fields, event types and enum values without a new version. Ignore unknown fields and
    tolerate unknown status values.


    Guides, quickstarts and error pages are at [developer.getreeds.co/docs](https://developer.getreeds.co/docs).
  contact:
    name: Reeds developer support
    email: support@getreeds.co
    url: https://developer.getreeds.co/docs
servers:
  - url: https://api.getreeds.co/shipping/v1
    description: Test and live, your credentials decide the mode
security:
  - OAuth2:
      - shipping
tags:
  - name: Authentication
    description: |
      Exchange your client id and secret for a one-hour bearer access token (OAuth 2.0 client credentials).
      The same endpoint serves every Reeds API; v1 has one scope, `shipping`.
  - name: Coverage
    description: |
      The states and zones Reeds serves, and the state-to-state routes it runs.
  - name: Address search
    description: >
      Free address search for your checkout: suggestions as your customer types, the full address of the one they
      choose, and the address at a map pin, each with the `lga` and `state` a quote needs and a `place_id` that makes
      the spot exact. Places in Nigeria, from Google.
  - name: Quotes
    description: >
      A quote prices one route and package, and holds that price for 24 hours. A route Reeds cannot serve is not an
      error: the quote comes back with `available: false` and a reason.
  - name: Deliveries
    description: >
      Book a delivery from a quote. Creating a delivery and starting it are different things: a delivery booked with
      `ready: false`, or one your team made in the dashboard that still has something outstanding, waits in
      `requires_action` until every required action is cleared.
  - name: Wallet
    description: >
      Prepaid accounts pay from a Naira wallet debited at booking. Invoice accounts book against a credit limit and read
      their room from the same endpoint.
  - name: Invoices
    description: >
      Platform accounts are billed monthly. An invoice is issued on the 1st for the previous month; an
      overdue invoice puts the account on hold. A business becomes a platform by applying in the dashboard; Reeds
      approves it with an agreement (a rate card, a credit limit and payment terms).
  - name: Webhooks
    description: >
      Reeds posts signed events to your HTTPS endpoint as deliveries and money move. Use this endpoint to send yourself
      a test event of any type.

      The events themselves are documented under Webhooks in the sidebar.
  - name: Sandbox
    description: >
      Test-mode helpers: top up the sandbox wallet and move a sandbox delivery through its statuses. They only work with
      `rci_test_` credentials.
x-tagGroups:
  - name: Start here
    tags:
      - Authentication
  - name: Shipping
    tags:
      - Coverage
      - Address search
      - Quotes
      - Deliveries
  - name: Money
    tags:
      - Wallet
      - Invoices
  - name: Integration
    tags:
      - Webhooks
      - Sandbox
paths:
  /oauth/token:
    post:
      operationId: createAccessToken
      tags:
        - Authentication
      summary: Get an access token
      description: >
        Exchange your client id and client secret for a bearer access token (OAuth 2.0 client credentials grant).

        Send `grant_type=client_credentials`, `client_id` and `client_secret` as a form-encoded body or as JSON, or send
        the

        id and secret as HTTP Basic credentials.


        - The credentials decide the mode: `rci_test_` ids give a test-mode token, `rci_live_` ids a live-mode one. The
        response carries `livemode`.

        - A token lasts one hour (`expires_in: 3600`). Cache it and fetch a new one shortly before it expires.

        - Revoking a secret also ends every token issued with it, within a minute.

        - If the account has turned on the optional live IP allowlist, a `rci_live_` client id is accepted only from an
        IP address on the list; from any other, the request fails with `unauthorized_client` and no token is issued.
        Test credentials are never restricted. See [Restrict live credentials by
        IP](https://developer.getreeds.co/docs/getting-started/authentication#recommended-restrict-live-credentials-by-ip).

        - This endpoint serves every Reeds API, not only shipping. It allows 60 requests a minute per client.

        - From a web page (the dashboard's API console, or this site's "try it"), only test credentials are accepted: a
        `rci_live_` client id sent with such a page's `Origin` gets `400 unauthorized_client`, and its secret isn't
        checked. Live credentials belong on your own servers.

        - Unlike the rest of the API, errors here use the standard OAuth shape (`{"error": "invalid_client"}`), not the
        Reeds failure envelope. The one exception is `429`, which uses the Reeds failure envelope (`RATE_LIMITED`, with
        `Retry-After`) like every other endpoint, so one rate-limit handler covers the whole API.

        - When Reeds is overloaded, the endpoint answers `503` with `{"error": "temporarily_unavailable"}` (the OAuth
        code for an overloaded server) and `Retry-After`. Nothing was checked or spent: send the same request again after
        that many seconds.
      servers:
        - url: https://api.getreeds.co
          description: Token endpoint host
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              grant_type: client_credentials
              client_id: rci_test_xxxxxxxxxxxx
              client_secret: rcs_test_xxxxxxxxxxxx
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              grant_type: client_credentials
              client_id: rci_test_xxxxxxxxxxxx
              client_secret: rcs_test_xxxxxxxxxxxx
              scope: shipping
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJyY2lfdGVzdF94eHgifQ.c2lnbmF0dXJl
                token_type: Bearer
                expires_in: 3600
                scope: shipping
                livemode: false
        '400':
          description: >
            The request can't be served. `invalid_request`: a required field is missing, the body can't be read, or the
            credentials came both in the body and as HTTP Basic. `unsupported_grant_type`: `grant_type` isn't
            `client_credentials`. `invalid_scope`: `scope` isn't `shipping`. `unauthorized_client`: the client isn't
            allowed to ask for a token from here, either because a `rci_live_` client id came from a web page (the API
            console takes test credentials only) or because the account has a live IP allowlist and the request came
            from an IP address that isn't on it. No token is issued; for `unauthorized_client` the secret isn't checked,
            so a wrong secret from an allowed place still gets `401`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              examples:
                ip_not_allowed:
                  summary: Live client id from an IP address that isn't on the allowlist
                  value:
                    error: unauthorized_client
                    error_description: This IP address isn't on the account's live IP allowlist.
                console_test_only:
                  summary: Live client id from a web page
                  value:
                    error: unauthorized_client
                    error_description: The API console takes test credentials only.
                unsupported_grant_type:
                  summary: Another grant
                  value:
                    error: unsupported_grant_type
                    error_description: Only grant_type=client_credentials is supported.
        '401':
          description: >-
            Wrong client id or secret, a revoked secret, or credentials the account can't use (for example live
            credentials before the account is approved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_client
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: >-
            Reeds is overloaded and shed this request (`temporarily_unavailable`). Nothing was checked or spent. Wait
            `Retry-After` seconds and send the same request again.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: temporarily_unavailable
                error_description: The server is busy. Retry after the number of seconds in Retry-After.
  /coverage:
    get:
      operationId: getCoverage
      tags:
        - Coverage
      summary: Get coverage
      description: |
        Lists the states Reeds serves, with whether it picks up and delivers in each, the zones it works in, and the
        state-to-state routes it runs. Reeds delivers across Nigeria: within the states it runs its own riders in
        (`zones` lists their areas), and between states along the routes listed under `interstate`, through its own
        and its partners' hubs. Whether Reeds serves an address is decided by its state when a quote places it
        (`ADDRESS_NOT_SERVICEABLE` otherwise); `zones` is for display, and its names don't always match an address's
        `location.lga`. A route that isn't listed has no price: a quote on it answers `INTERSTATE_NOT_AVAILABLE`.
        Reeds adds states and routes over time, so read this rather than keeping your own list.
      responses:
        '200':
          description: Current coverage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageEnvelope'
              example:
                status: success
                data:
                  states:
                    - state: Lagos
                      pickup: true
                      delivery: true
                      zones:
                        - Ikeja
                        - Lekki
                        - Yaba
                        - Surulere
                    - state: FCT
                      pickup: true
                      delivery: true
                      zones: []
                    - state: Rivers
                      pickup: false
                      delivery: true
                      zones: []
                  interstate:
                    - from: Lagos
                      to: FCT
                      promise: 3-5 working days
                      available: true
                    - from: FCT
                      to: Lagos
                      promise: 3-5 working days
                      available: true
                    - from: Lagos
                      to: Rivers
                      promise: 3-5 working days
                      available: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /addresses/autocomplete:
    get:
      operationId: autocompleteAddresses
      tags:
        - Address search
      summary: Search addresses as a customer types
      description: >
        Suggests places in Nigeria for what your customer has typed so far, for an address field that completes as they
        type. Pass the chosen suggestion's `place_id` to `GET /addresses/details` for the full address, or straight
        into a quote's `place_id`.


        - Send a `session_token` of your own (a UUID works): one per address being typed, the same on every call while
        that customer types, and on the `GET /addresses/details` call that ends it. The whole search then counts as **one**.
        Start a new token for the next address.

        - Results are restricted to Nigeria. At most 6 come back; an empty list means nothing matched.

        - Call it from your server, as every live call is: your page calls your server, which calls Reeds. Show
        Google's attribution (the "Google" logo or text) next to the suggestions when they aren't on a Google map.

        - Address search is free. In Test each account has an allowance of searches (50 to start; Reeds can raise it).
        In Live it is unlimited unless Reeds has set a monthly limit for the account, and Reeds can switch it off for an
        account. Past the allowance or the limit the answer is `403 ADDRESS_SEARCH_LIMIT_REACHED`; switched off, `403
        ADDRESS_SEARCH_DISABLED`.

        - Limited to 120 requests a minute on business accounts and 600 on platform accounts.
      parameters:
        - name: query
          in: query
          required: true
          description: What the customer has typed, 1 to 200 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: 23 Allen Avenue
        - name: session_token
          in: query
          required: true
          description: >-
            Your token for this search: 8 to 36 letters, digits, hyphens or underscores (a UUID works). The same on
            every call while one address is typed, so the search counts once.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,36}$
          example: 3f2c8d1e-7b4a-4c55-9e0d-2a6b1f9c8e70
      responses:
        '200':
          description: The suggestions, best first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSuggestionsEnvelope'
              example:
                status: success
                data:
                  suggestions:
                    - place_id: ChIJN1t_tDeuEmsRUsoyG83frY4
                      main_text: 23 Allen Avenue
                      secondary_text: Ikeja, Lagos, Nigeria
                    - place_id: ChIJ8TQy0JKLOxARmZ9bJc2sVkA
                      main_text: Allen Avenue Roundabout
                      secondary_text: Ikeja, Lagos, Nigeria
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /addresses/details:
    get:
      operationId: getAddressDetails
      tags:
        - Address search
      summary: Get the address of a place
      description: >
        Returns the full address of a place: a suggestion your customer chose from `GET /addresses/autocomplete`, or any
        Google place id in Nigeria. `lga` and `state` are what a quote needs, and `place_id` makes the spot exact.


        - Send the search's `session_token` so this call ends that search instead of counting as another. Without one,
        the call is a search of its own.

        - `precise` is `true` for a street address, building or business, and `false` for a whole area or road (its
        point is only the middle of it): ask your customer for the street when it is `false`.

        - `lga` is `null` when Google doesn't name one; ask your customer, because a quote needs it.
      parameters:
        - name: place_id
          in: query
          required: true
          description: >-
            The `place_id` of a suggestion, or any Google place id. Not a Reeds address id (`adr_`): those name a
            delivery's stops.
          schema:
            type: string
          example: ChIJN1t_tDeuEmsRUsoyG83frY4
        - name: session_token
          in: query
          required: false
          description: The token of the search this place was chosen in.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,36}$
          example: 3f2c8d1e-7b4a-4c55-9e0d-2a6b1f9c8e70
      responses:
        '200':
          description: The place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceEnvelope'
              example:
                status: success
                data:
                  place_id: ChIJN1t_tDeuEmsRUsoyG83frY4
                  name: 23 Allen Avenue
                  formatted_address: 23 Allen Ave, Allen, Ikeja 101233, Lagos, Nigeria
                  area: Ikeja
                  lga: Ikeja
                  state: Lagos
                  country: NG
                  latitude: 6.6018
                  longitude: 3.3515
                  precise: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /addresses/reverse:
    get:
      operationId: reverseGeocodeAddress
      tags:
        - Address search
      summary: Find the address at a map pin
      description: >
        Returns the address nearest to a point in Nigeria, for a map where your customer drops a pin. Each call is one
        search.


        - The answer is the address Google finds there, with its own coordinates. To deliver to the pin itself, send
        your pin's `latitude` and `longitude` in the quote, with this address as the text; to deliver to the address
        found, send its `place_id`.

        - A point outside Nigeria is refused with `422 INVALID_REQUEST`; a point with no address near it gets `404
        NOT_FOUND`.

        - Show the pin on a Google map, as Google's terms require for its addresses.
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 6.6018
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 3.3515
      responses:
        '200':
          description: The address at that spot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceEnvelope'
              example:
                status: success
                data:
                  place_id: ChIJN1t_tDeuEmsRUsoyG83frY4
                  name: 23 Allen Ave
                  formatted_address: 23 Allen Ave, Allen, Ikeja 101233, Lagos, Nigeria
                  area: Ikeja
                  lga: Ikeja
                  state: Lagos
                  country: NG
                  latitude: 6.6018
                  longitude: 3.3515
                  precise: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /quotes:
    post:
      operationId: createQuote
      tags:
        - Quotes
      summary: Create a quote
      description: >
        Prices a route and package. Send the pickup and drop-off as address objects (`pickup`, `dropoff`): the contact,
        the street address as text, its `lga` (local government area) and `state`, both required, and its `area` when
        your customer gives one. This is the one call a checkout makes to show a delivery price; the second call is
        `POST /deliveries` with the `quote_id`.


        - A quote lasts 24 hours and books one delivery. The price is locked: booking within 24 hours pays exactly the
        quoted total.

        - Reeds always prices the address. It looks the text up with Google Maps and, when the match is exact, prices
        from that spot. When Google is unsure (it has only the middle of a street or an estate, or had to drop part of
        the text) Reeds uses Google's point if it lies in the area or LGA you named, and otherwise prices from the centre
        of that area, from Reeds' own area data (the centre of the LGA when you sent no area). Riders use the street
        text and call the receiver for the exact spot. You get a plain price either way.

        - Send `latitude` and `longitude` (your own map pin) or a Google `place_id` when you have them: the spot is then
        yours, and `area`, `lga` and `state` only name it. The address search (`GET /addresses/autocomplete`) gives you a
        `place_id` with the `lga` and `state` to send.

        - `service` is `standard` within a state (a two-day range) and `interstate` between states (the route's
        promise in working days, 3 to 5 by default; see `GET /coverage` for the routes and their promises).

        - `schedule` is the promise if you book now. A delivery's own schedule is worked out when it is booked and
        ready, so a quote booked after the day's cut-off gets later dates. The price doesn't change.

        - `route.type` is `direct` (under 7 km: one rider, no hub), `via_hub` (collected into the nearest Reeds hub,
        then delivered) or `interstate` (collected into a hub in the pickup state, carried to a Reeds or partner hub in
        the drop-off state, and delivered from there). An inter-state route is priced per route, not by distance, so
        its `route.distance_km` is `null`.

        - When Reeds cannot serve the route the response is **not** an error: you get `200` with `available: false` and
        a `reason`. Treat it as "Reeds is not an option for this checkout". `ADDRESS_NOT_FOUND` means Reeds knows
        neither the area nor the LGA you sent in that state: check the spelling of `lga` and `state`, add or check the
        `area`, or send coordinates or a place id. `INTERSTATE_NOT_AVAILABLE` means Reeds has no price for that pair of
        states; `ADDRESS_NOT_SERVICEABLE` means it doesn't pick up or deliver in one of them.

        - The addresses are kept with the quote for 30 days, then deleted unless the quote became a delivery. There is
        no address book: `pickup_address_id` and `dropoff_address_id` are refused with `422 INVALID_REQUEST` naming the
        field.

        - If Reeds can't measure the route right now (its maps service is unavailable) the answer is `503
        SERVICE_UNAVAILABLE`, not `available: false`: retry shortly.

        - Limited to 30 requests a minute on business accounts and 300 on platform accounts; ask Reeds to raise it for
        checkout use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              text_addresses:
                summary: Addresses as text (a checkout)
                value:
                  pickup:
                    name: Tola Fabrics
                    phone: '08051234567'
                    address: 23 Allen Avenue
                    area: Ikeja
                    lga: Ikeja
                    state: Lagos
                  dropoff:
                    name: Chinedu Eze
                    phone: '08098765432'
                    address: 14 Admiralty Way
                    area: Lekki Phase 1
                    lga: Eti-Osa
                    state: Lagos
                  package:
                    description: 2 pairs of sneakers
                    quantity: 1
                    weight_kg: 1.5
                    declared_value: 4500000
                  pickup_date: '2026-10-26'
              with_pins:
                summary: With a place id and a map pin
                value:
                  pickup:
                    name: Tola Fabrics
                    phone: '08051234567'
                    address: 23 Allen Avenue
                    area: Ikeja
                    lga: Ikeja
                    state: Lagos
                    place_id: ChIJN1t_tDeuEmsRUsoyG83frY4
                  dropoff:
                    name: Chinedu Eze
                    phone: '08098765432'
                    address: 14 Admiralty Way
                    area: Lekki Phase 1
                    lga: Eti-Osa
                    state: Lagos
                    latitude: 6.4474
                    longitude: 3.4723
                  package:
                    description: 2 pairs of sneakers
                    quantity: 1
                    weight_kg: 1.5
                    declared_value: 4500000
      responses:
        '200':
          description: Reeds cannot serve this route. Not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteUnavailableEnvelope'
              examples:
                not_serviceable:
                  summary: Drop-off outside coverage
                  value:
                    status: success
                    data:
                      available: false
                      reason:
                        code: ADDRESS_NOT_SERVICEABLE
                        message: The drop-off is outside Reeds' coverage.
                address_not_found:
                  summary: Reeds knows neither the area nor the LGA sent
                  value:
                    status: success
                    data:
                      available: false
                      reason:
                        code: ADDRESS_NOT_FOUND
                        message: "Reeds couldn't place the drop-off address: check its local government area and state, or add its area."
        '201':
          description: A priced quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteEnvelope'
              example:
                status: success
                data:
                  id: qt_2bX9Wn4K
                  available: true
                  livemode: true
                  expires_at: '2026-10-27T10:20:00+01:00'
                  service: standard
                  route:
