      description: >
        Returns the invoice as a PDF (A4): the bill-to, the period, issue and due dates, the summary (delivery fees, VAT
        on the delivery fees only, service charges, adjustments, total, paid, credited, amount due) and every line.
        Answers `304` to a matching `If-None-Match`.
      responses:
        '200':
          description: The invoice.
          headers:
            ETag:
              description: Changes when anything on the invoice changes.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '304':
          description: 'Not modified: the copy you have (its `ETag`) is current.'
