  delivery.created:
    post:
      operationId: webhookDeliveryCreated
      tags:
        - Webhooks
      summary: delivery.created
      description: >
        A delivery was created: booked from a quote, or made in the dashboard. Every event is a `POST` with a JSON body and the `Reeds-Event-Id`,
        `Reeds-Event-Type` and

        `Reeds-Signature` headers. Verify the signature (`v1` is the HMAC-SHA256 of `t + "." + raw body` with your
        `whsec_test_` or `whsec_live_` secret) and reject a

        request whose `t` is more than 5 minutes old. Reply `2xx` within 10 seconds or Reeds retries 1 minute, 5
        minutes, 30 minutes,

        2 hours, 6 hours, 12 hours and 24 hours after the previous attempt (each with up to 15 seconds of jitter), then
        marks the event failed. A redirect counts as a failure and is never followed. An endpoint that keeps failing for
        3 days is disabled: waiting events are marked failed, and the account's Owners, Admins and Developers are
        emailed. Save its URL again in the dashboard to turn it back on; failed events can be resent from the event log.
        An event can arrive more than once and out of order: skip ids you have
        processed and compare

        `data.delivery.updated_at`.
