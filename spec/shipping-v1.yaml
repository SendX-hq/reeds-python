        - Webhooks
      summary: wallet.low_balance
      description: >
        The balance fell to or below the low-balance threshold you set in the dashboard. Sent once, by the debit
        that crosses it (a batch of bookings that crosses it sends one). Not sent again until the balance has
        risen back to the threshold plus a margin (₦1,000 or 10% of the threshold, whichever is more) and fallen
        again, and at most once an hour. Changing the threshold re-arms it without sending one. Sent in test mode
        too, so you can test your handler; the email to the account's Owners and Admins goes in live mode only.
