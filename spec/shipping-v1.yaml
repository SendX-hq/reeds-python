components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: >
        OAuth 2.0 client credentials. Exchange your client id and secret at `POST https://api.getreeds.co/oauth/token`,
        then send

        `Authorization: Bearer <access_token>`. Tokens last one hour.
      flows:
        clientCredentials:
          tokenUrl: https://api.getreeds.co/oauth/token
          scopes:
            shipping: Quotes, deliveries, wallet and invoices.
  parameters:
    DeliveryId:
      name: id
      in: path
      required: true
      description: The delivery id.
      schema:
        type: string
        examples:
          - dlv_9Kd3Qx7M
    InvoiceId:
      name: id
      in: path
      required: true
      description: The invoice id.
      schema:
        type: string
        examples:
          - inv_6Gc4Yt8N
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        A unique string you generate for this attempt, up to 200 characters, such as `order-10045-delivery-1`. Keys are
        scoped to the account

        and mode and kept for 24 hours. Same key and same body replays the original response with `Idempotent-Replayed:
        true`; same key with a

        different body gets `422 IDEMPOTENCY_KEY_REUSED`; same key while the first request is running gets `409
        REQUEST_IN_PROGRESS`.

        Requests that fail with 401, 402, 403, 409 or 429 release the key, so you can retry with it once the cause is
        fixed. Answers with 400, 404 or 422 are saved and replayed like a success: fix the request and send it with a
        new key. A 5xx releases it only if nothing was saved: if the work was saved and the request failed afterwards,
        a retry with the same key replays the saved result.
      schema:
        type: string
        maxLength: 200
        examples:
          - order-10045-delivery-1
    Limit:
      name: limit
      in: query
      description: How many objects to return, from 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    StartingAfter:
      name: starting_after
      in: query
      description: Cursor for the next page. Pass the id of the last object you received.
      schema:
        type: string
        examples:
          - dlv_9Kd3Qx7M
    ReedsSignature:
      name: Reeds-Signature
      in: header
      required: true
      description: >
        `t=<unix time>,v1=<hex>`. `v1` is the HMAC-SHA256 of `t + "." + raw body` with your webhook signing secret.
        During a secret rotation the

        header carries two `v1` values for 24 hours, one per secret: accept the request if any matches. Reject a
        request whose `t` is more than 5 minutes old.
      schema:
        type: string
        examples:
          - t=1793016302,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
    ReedsEventId:
      name: Reeds-Event-Id
      in: header
      required: true
      description: The event id (`evt_`). Use it to skip events you have already processed.
      schema:
        type: string
        examples:
          - evt_4fQ7Hd2X
    ReedsEventType:
      name: Reeds-Event-Type
      in: header
      required: true
      description: The event type, for example `delivery.status_changed`.
      schema:
        type: string
        examples:
          - delivery.status_changed
  headers:
    IdempotentReplayed:
      description: '`true` when this response is the saved result of an earlier request with the same idempotency key.'
      schema:
        type: string
        enum:
          - 'true'
    RateLimitLimit:
      description: Requests allowed per minute for this endpoint group.
      schema:
        type: integer
        examples:
          - 120
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
        examples:
          - 0
    RateLimitReset:
      description: Unix time (seconds) when the window resets.
      schema:
        type: integer
        examples:
          - 1793016360
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        examples:
          - 23
  responses:
    WebhookAck:
      description: Acknowledge with any `2xx` within 10 seconds.
    BadRequest:
      description: Malformed request, such as invalid JSON or a missing required header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_json:
              value:
                status: failed
                error:
                  code: INVALID_JSON
                  message: The request body is not valid JSON.
                  doc_url: https://developer.getreeds.co/errors/INVALID_JSON
                  fields: []
            idempotency_key_required:
              value:
                status: failed
                error:
                  code: IDEMPOTENCY_KEY_REQUIRED
                  message: This request needs an Idempotency-Key header.
                  doc_url: https://developer.getreeds.co/errors/IDEMPOTENCY_KEY_REQUIRED
                  fields: []
    Unauthorized:
      description: The access token is missing, invalid, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                status: failed
                error:
                  code: UNAUTHENTICATED
                  message: Missing, invalid or revoked access token.
                  doc_url: https://developer.getreeds.co/errors/UNAUTHENTICATED
                  fields: []
            token_expired:
              value:
                status: failed
                error:
                  code: TOKEN_EXPIRED
                  message: The access token has expired. Get a new one from /oauth/token.
                  doc_url: https://developer.getreeds.co/errors/TOKEN_EXPIRED
                  fields: []
    PaymentRequired:
      description: The wallet does not cover the total, or the invoice account has reached its credit limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficient_balance:
              value:
                status: failed
                error:
                  code: INSUFFICIENT_BALANCE
                  message: >-
                    The wallet balance (NGN 1,200.00) does not cover this delivery (NGN 2,800.00). Fund the wallet and
                    retry with the same Idempotency-Key.
                  doc_url: https://developer.getreeds.co/errors/INSUFFICIENT_BALANCE
                  fields: []
            credit_limit_reached:
              value:
                status: failed
                error:
                  code: CREDIT_LIMIT_REACHED
                  message: This delivery would take the account over its credit limit.
                  doc_url: https://developer.getreeds.co/errors/CREDIT_LIMIT_REACHED
                  fields: []
    Forbidden:
      description: >-
        The token lacks the scope, the account is on hold, a live token is used from an IP address that isn't on the
        account's live IP allowlist, a live token is sent from a web page (the API console works with test tokens only),
        a sandbox endpoint is called with live credentials, or (address search) the account has used its searches or
        Reeds has switched address search off for it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficient_scope:
              value:
                status: failed
                error:
                  code: INSUFFICIENT_SCOPE
                  message: The token does not carry the scope this endpoint needs.
                  doc_url: https://developer.getreeds.co/errors/INSUFFICIENT_SCOPE
                  fields: []
            account_on_hold:
              value:
                status: failed
                error:
                  code: ACCOUNT_ON_HOLD
                  message: An invoice is overdue. New bookings are paused until it is paid.
                  doc_url: https://developer.getreeds.co/errors/ACCOUNT_ON_HOLD
                  fields: []
                  hold_reason: overdue_invoice
            ip_not_allowed:
              summary: Live token from an IP address that isn't on the allowlist
              value:
                status: failed
                error:
                  code: IP_NOT_ALLOWED
                  message: Requests from 203.0.113.7 aren't on this account's live IP allowlist. Add it in the dashboard under Developers.
                  doc_url: https://developer.getreeds.co/errors/IP_NOT_ALLOWED
                  fields: []
            test_mode_only:
              summary: Live token sent from a web page
              value:
                status: failed
                error:
                  code: TEST_MODE_ONLY
                  message: The API console works with test tokens only. Use live credentials from your own servers.
                  doc_url: https://developer.getreeds.co/errors/TEST_MODE_ONLY
                  fields: []
            address_search_limit_reached:
              summary: The account has used its address searches
              value:
                status: failed
                error:
                  code: ADDRESS_SEARCH_LIMIT_REACHED
                  message: This account has used its 50 test address searches. Contact Reeds support for more.
                  doc_url: https://developer.getreeds.co/errors/ADDRESS_SEARCH_LIMIT_REACHED
                  fields: []
            address_search_disabled:
              summary: Reeds has switched address search off for the account
              value:
                status: failed
                error:
                  code: ADDRESS_SEARCH_DISABLED
                  message: Address search is turned off for this account in Live. Contact Reeds support to turn it back on.
                  doc_url: https://developer.getreeds.co/errors/ADDRESS_SEARCH_DISABLED
                  fields: []
    NotFound:
      description: No such object for this account. Another account's id also returns 404.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: failed
            error:
              code: NOT_FOUND
              message: No such delivery.
              doc_url: https://developer.getreeds.co/errors/NOT_FOUND
              fields: []
    Conflict:
      description: The request conflicts with the current state of the object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            action_not_allowed:
              value:
                status: failed
                error:
                  code: ACTION_NOT_ALLOWED
                  message: This delivery isn't priced yet, so it can't be booked.
                  doc_url: https://developer.getreeds.co/errors/ACTION_NOT_ALLOWED
                  fields: []
            request_in_progress:
              value:
                status: failed
                error:
                  code: REQUEST_IN_PROGRESS
                  message: A request with this Idempotency-Key is still running. Retry shortly.
                  doc_url: https://developer.getreeds.co/errors/REQUEST_IN_PROGRESS
                  fields: []
    ValidationFailed:
      description: Validation failed. `error.fields` lists each problem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: failed
            error:
              code: INVALID_REQUEST
              message: One or more fields are invalid.
              doc_url: https://developer.getreeds.co/errors/INVALID_REQUEST
              fields:
                - field: phone
                  message: Enter a valid Nigerian mobile number
    TooManyRequests:
      description: >-
        Rate limit reached, or (on `POST /quotes` and the address search, the endpoints that look up addresses) the
        account has used its daily allowance
        for address lookups and pricing, which resets at midnight Lagos time. Both are `RATE_LIMITED`; the message
        says which. Wait `Retry-After` seconds (for the daily allowance, until midnight in Lagos).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limit:
              summary: Over the per-minute rate limit
              value:
                status: failed
                error:
                  code: RATE_LIMITED
                  message: Too many requests. Retry in 23 seconds.
                  doc_url: https://developer.getreeds.co/errors/RATE_LIMITED
                  fields: []
            daily_allowance:
              summary: The account's daily allowance for address lookups and pricing is used up
              value:
                status: failed
                error:
                  code: RATE_LIMITED
                  message: >-
                    Your account has used today's allowance for address lookups and pricing. It resets at midnight,
                    Lagos time. Contact Reeds support if you need more.
                  doc_url: https://developer.getreeds.co/errors/RATE_LIMITED
                  fields: []
    ServerError:
      description: Something failed inside Reeds. Safe to retry with the same `Idempotency-Key`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: failed
            error:
              code: INTERNAL_ERROR
              message: Something went wrong on our side. Retry with the same Idempotency-Key.
              doc_url: https://developer.getreeds.co/errors/INTERNAL_ERROR
              fields: []
    ServiceUnavailable:
      description: >-
        Reeds can't serve the request right now, and nothing was done. Either Reeds is overloaded and shed it (any
        endpoint; `Retry-After` says how many seconds to wait), or a service Reeds depends on (maps, payments) is
        unavailable. Wait `Retry-After` seconds when it is present (otherwise back off), then send the same request
        again with the same `Idempotency-Key`.
      headers:
        Retry-After:
          description: >-
            Seconds to wait before retrying. Always sent when Reeds is shedding load; a dependency being down may leave
            it out.
          required: false
          schema:
            type: integer
            examples:
              - 2
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            busy:
              summary: Reeds is overloaded (load shedding)
              value:
                status: failed
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Reeds is busy right now. Retry after the number of seconds in Retry-After.
                  doc_url: https://developer.getreeds.co/errors/SERVICE_UNAVAILABLE
                  fields: []
            dependency:
              summary: A service Reeds depends on is unavailable
              value:
                status: failed
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Address lookup is temporarily unavailable. Retry shortly.
                  doc_url: https://developer.getreeds.co/errors/SERVICE_UNAVAILABLE
                  fields: []
  schemas:
    TokenRequest:
      type: object
      required:
        - grant_type
      description: Send `client_id` and `client_secret` in the body, or as HTTP Basic credentials.
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
        client_id:
          type: string
          description: Starts `rci_test_` or `rci_live_`.
          examples:
            - rci_test_xxxxxxxxxxxx
        client_secret:
          type: string
          description: Starts `rcs_test_` or `rcs_live_`.
          examples:
            - rcs_test_xxxxxxxxxxxx
        scope:
          type: string
          description: Optional. v1 has one scope, `shipping`.
          examples:
            - shipping
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - scope
        - livemode
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Seconds until the token expires.
          examples:
            - 3600
        scope:
          type: string
          examples:
            - shipping
        livemode:
          type: boolean
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Standard OAuth error code.
          examples:
            - invalid_client
        error_description:
          type: string
    SuccessEnvelope:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum:
            - success
        data: {}
    ListEnvelope:
      type: object
      required:
        - status
        - data
        - has_more
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          items: {}
        has_more:
          type: boolean
          description: '`true` when more objects follow. Pass the last id as `starting_after`.'
    Error:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: string
          enum:
            - failed
        error:
          type: object
          required:
            - code
            - message
            - doc_url
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable. Do not branch on it.
            doc_url:
              type: string
              format: uri
              description: Link to the error's page, `https://developer.getreeds.co/errors/<CODE>`.
            fields:
              type: array
              description: Each invalid field, for validation errors.
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                    examples:
                      - dropoff.lga
                  message:
                    type: string
            delivery_id:
              type: string
              description: 'Only on `QUOTE_ALREADY_USED`: the delivery the quote booked.'
              examples:
                - dlv_9Kd3Qx7M
            hold_reason:
              type: string
              enum:
                - overdue_invoice
                - reeds
              description: >-
                Only on `ACCOUNT_ON_HOLD`: why the account is on hold. `overdue_invoice`: an invoice is overdue; paying it
                lifts the hold. `reeds`: Reeds paused the account; contact Reeds. Branch on this, not on `message`.
              examples:
                - overdue_invoice
    ErrorCode:
      type: string
      description: Stable error code. Clients may see codes added over time.
      enum:
        - INVALID_JSON
        - IDEMPOTENCY_KEY_REQUIRED
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - INSUFFICIENT_SCOPE
        - ACCOUNT_ON_HOLD
        - IP_NOT_ALLOWED
        - TEST_MODE_ONLY
        - NOT_FOUND
        - PICKUP_DATE_OUT_OF_RANGE
        - QUOTE_EXPIRED
        - QUOTE_ALREADY_USED
        - INSUFFICIENT_BALANCE
        - CREDIT_LIMIT_REACHED
        - ACTION_NOT_ALLOWED
        - CANCEL_NOT_ALLOWED
        - SHIPPER_REQUIRED
        - PARCEL_TOO_HEAVY
        - PARCEL_TOO_LARGE
        - PROHIBITED_ITEM
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - ADDRESS_SEARCH_DISABLED
        - ADDRESS_SEARCH_LIMIT_REACHED
    Contact:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
          description: Contact name.
          examples:
            - Ada Okafor
        phone:
          type: string
          description: Nigerian mobile number in the `0XXXXXXXXXX` form.
          examples:
            - '08031234567'
        email:
          type:
            - string
            - 'null'
          examples:
            - ada@example.com
    Location:
      type: object
      properties:
        formatted_address:
          type: string
          examples:
            - 23 Allen Ave, Ikeja, Lagos 101233, Nigeria
        place_id:
          type:
            - string
            - 'null'
          description: Google place id. `null` when Reeds placed the address from your coordinates rather than a Google place.
        latitude:
          type: number
          examples:
            - 6.6018
        longitude:
          type: number
          examples:
            - 3.3515
        lga:
          type: string
          description: The part of town (the local government area, or the locality people name, such as Ikeja or Lekki).
          examples:
            - Ikeja
        state:
          type: string
          examples:
            - Lagos
        country:
          type: string
          examples:
            - NG
    AddressInput:
      type: object
      required:
        - name
        - phone
        - address
        - lga
        - state
      description: >-
        One end of a delivery: who is there, and where. The street address is text; `lga` and `state` name where it is
        and are required. `area` (the neighbourhood or town) is optional: send it when your customer gives one, because
        it is what Reeds prices from when the text alone can't be matched exactly (without it, the LGA's centre is
        used).
      properties:
        name:
          type: string
          description: Contact name.
          examples:
            - Ada Okafor
        phone:
          type: string
          description: Nigerian mobile number. `+234` and `0` forms are both accepted.
          examples:
            - '08031234567'
        email:
          type: string
          format: email
        address:
          type: string
          maxLength: 300
          description: The street address as text, as your customer typed it.
          examples:
            - 23 Allen Avenue
        area:
          type: string
          maxLength: 100
          description: >-
            Optional. The neighbourhood or town, as your customer knows it (Ikeja, Lekki Phase 1, Ajah). Send it when
            you have it: an address Google can't match exactly is priced from this area's centre, or from the LGA's
            when there is no area.
          examples:
            - Ikeja
        lga:
          type: string
          maxLength: 100
          description: The local government area.
          examples:
            - Ikeja
        state:
          type: string
          maxLength: 60
          examples:
            - Lagos
        place_id:
          type: string
          description: >-
            Google place id, if you have one (address search gives you one: `GET /addresses/autocomplete`, then `GET
            /addresses/details`). The place is then the spot.
        latitude:
          type: number
          description: If you have them (for example from your own map pin), the pin is the spot. Send with `longitude`.
        longitude:
          type: number
        notes:
          type: string
          description: Directions or landmark for the rider.
        metadata:
          $ref: '#/components/schemas/Metadata'
    Metadata:
      type: object
      description: >-
        Up to 20 string key/value pairs (keys up to 40 characters, values up to 500), returned in responses and
        webhooks.
      maxProperties: 20
      additionalProperties:
        type: string
    Coverage:
      type: object
      properties:
        states:
          type: array
          items:
            type: object
            properties:
              state:
                type: string
                examples:
                  - Lagos
              pickup:
                type: boolean
                description: Reeds collects parcels in this state (with its own riders, or through a partner hub a route starts from).
              delivery:
                type: boolean
                description: Reeds delivers parcels in this state (with its own riders, or through a partner hub a route ends in).
              zones:
                type: array
                description: The areas Reeds' own riders work in, for display. Empty for a state served through a partner hub.
                items:
                  type: string
        interstate:
          type: array
          description: The state-to-state routes Reeds runs. A pair of states not listed has no price.
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              promise:
                type: string
                description: The delivery promise on this route, in working days.
                examples:
                  - 3-5 working days
              available:
                type: boolean
                description: Whether a quote on this route is priced. Listed routes are available; tolerate `false`.
    CoverageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Coverage'
    PlaceSuggestion:
      type: object
      required:
        - place_id
        - main_text
        - secondary_text
      properties:
        place_id:
          type: string
          description: Google place id. Pass it to `GET /addresses/details`, or as a quote's `place_id`.
          examples:
            - ChIJN1t_tDeuEmsRUsoyG83frY4
        main_text:
          type: string
          description: The place itself, for the first line of a suggestion.
          examples:
            - 23 Allen Avenue
        secondary_text:
          type: string
          description: Where it is, for the second line. Can be empty.
          examples:
            - Ikeja, Lagos, Nigeria
    PlaceSuggestionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - suggestions
              properties:
                suggestions:
                  type: array
                  maxItems: 6
                  items:
                    $ref: '#/components/schemas/PlaceSuggestion'
    Place:
      type: object
      required:
        - place_id
        - name
        - formatted_address
        - area
        - lga
        - state
        - country
        - latitude
        - longitude
        - precise
      properties:
        place_id:
          type: string
          description: Google place id. Send it as a quote's `place_id` to make the spot exact.
          examples:
            - ChIJN1t_tDeuEmsRUsoyG83frY4
        name:
          type: string
          description: The place's name, or the start of its address.
          examples:
            - 23 Allen Avenue
        formatted_address:
          type: string
          description: The full address as Google writes it. Works as a quote's `address` text.
          examples:
            - 23 Allen Ave, Allen, Ikeja 101233, Lagos, Nigeria
        area:
          type:
            - string
            - 'null'
          description: The part of town people name (Ikeja, Lekki Phase 1), for a quote's `area`.
          examples:
            - Ikeja
        lga:
          type:
            - string
            - 'null'
          description: The local government area, for a quote's `lga`. `null` when Google doesn't name one.
          examples:
            - Ikeja
        state:
          type: string
          description: The state as Reeds spells it (`Lagos`, `FCT`), for a quote's `state`.
          examples:
            - Lagos
        country:
          type: string
          enum:
            - NG
        latitude:
          type: number
          examples:
            - 6.6018
        longitude:
          type: number
          examples:
            - 3.3515
        precise:
          type: boolean
          description: >-
            `true` for a street address, building or business; `false` for a whole area or road, whose point is only
            its middle.
    PlaceEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Place'
    Package:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          description: >-
            What it is. Screened for items Reeds can't carry (cash, weapons, drugs, hazardous goods, perishable food):
            `422 PROHIBITED_ITEM`.
          examples:
            - 2 pairs of sneakers
        quantity:
          type: integer
          minimum: 1
          default: 1
        weight_kg:
          type: number
          description: The parcel's weight. Up to 100 kg; heavier is `422 PARCEL_TOO_HEAVY`.
          examples:
            - 1.5
        declared_value:
          type: integer
          description: >-
            Declared value of the contents, in kobo. Accepted at any amount; Reeds covers loss or damage up to the
            declared value, at most ₦50,000 (see `liability` on the delivery).
          examples:
            - 4500000
        dimensions_cm:
          type: object
          description: Optional. The parcel's size in centimetres. The longest side can be up to 120 cm; longer is `422 PARCEL_TOO_LARGE`.
          required:
            - length
            - width
            - height
          properties:
            length:
              type: number
              exclusiveMinimum: 0
              examples:
                - 30
            width:
              type: number
              exclusiveMinimum: 0
              examples:
                - 20
            height:
              type: number
              exclusiveMinimum: 0
              examples:
                - 12
    Fee:
      type: object
      description: All amounts are integers in kobo.
      required:
        - delivery_fee
        - vat
        - service_charge
        - discount
        - total
        - currency
      properties:
        delivery_fee:
          type: integer
          description: Within a state, the distance-tier price; between states, the route's price. In kobo.
          examples:
            - 255000
        vat:
          type: integer
          description: 7.5% VAT on the delivery fee, in kobo. An inter-state delivery has none.
          examples:
            - 19125
        service_charge:
          type: integer
          description: >-
            What rounds the total up to the next NGN 50 (at least NGN 25 is kept as service charge). Carries no VAT. In
            kobo. An inter-state delivery has none: its total is the route's price.
          examples:
            - 5875
        discount:
          type: integer
          description: Discount applied, in kobo.
          examples:
            - 0
        total:
          type: integer
          description: What the delivery costs, in kobo. NGN 2,800.00 is 280000.
          examples:
            - 280000
        currency:
          type: string
          enum:
            - NGN
    DeliveryFee:
      description: The fee on a delivery, with its charging state.
      allOf:
        - $ref: '#/components/schemas/Fee'
        - type: object
          properties:
            status:
              type: string
              enum:
                - unpriced
                - quoted
                - charged
                - refunded
              description: '`quoted` is priced but not charged.'
            billing:
              type: string
              enum:
                - wallet
                - invoice
    Schedule:
      type: object
      description: "The promise, in Lagos time: the day Reeds collects, and the delivery range."
      properties:
        pickup_by:
          type: string
          format: date
          description: >-
            The day Reeds collects the parcel (a Lagos calendar date, `YYYY-MM-DD`), during working hours. No time of
            day is promised for the pickup.
          examples:
            - '2026-10-26'
        deliver_by:
          type: string
          format: date-time
        earliest_delivery:
          type:
            - string
            - 'null'
          format: date-time
          description: |-
            The first day of the promised range, and `deliver_by` is the last. Within a state the range is two working
            days; interstate deliveries run 3 to 5 working days. It is written at close of business, like `deliver_by`:
            read the day, because a delivery can arrive at any time on it. `null` on a delivery booked before ranges
            existed, and after a `delivery.schedule_changed`, when `deliver_by` alone is the promise.
    Route:
      type: object
      properties:
        type:
          type: string
          enum:
            - direct
            - via_hub
            - interstate
          description: >-
            `direct` is under 7 km (one rider, no hub); `via_hub` goes through the nearest Reeds hub; `interstate`
            crosses a state line through a hub at each end (Reeds' own or a partner's). Tolerate values you don't know.
        distance_km:
          description: >-
            The road distance the price was worked out on, in kilometres. `null` on an `interstate` route: its price is
            set per route, not by distance.
          oneOf:
            - type: number
            - type: 'null'
          examples:
            - 13.5
    Service:
      type: string
      enum:
        - standard
        - interstate
      description: >-
        `standard` is within a state, a two-day range from `earliest_delivery` to `deliver_by`. `interstate` is a
        delivery to another state, promised in working days: `earliest_delivery` and `deliver_by` are the route's
        earliest and latest (3 to 5 working days by default; `GET /coverage` lists each route's promise). Tolerate
        values you don't know.
    QuoteRequest:
      type: object
      required:
        - pickup
        - dropoff
        - package
      properties:
        pickup:
          $ref: '#/components/schemas/AddressInput'
        dropoff:
          $ref: '#/components/schemas/AddressInput'
        package:
          $ref: '#/components/schemas/Package'
        pickup_date:
          type: string
          format: date
          description: >-
            The day the parcel is ready for pickup, in Lagos time. Defaults to today; up to 7 days ahead. Outside that
            range is `422 PICKUP_DATE_OUT_OF_RANGE`. The schedule counts from it.
    Quote:
      type: object
      required:
        - id
        - available
        - livemode
        - expires_at
        - service
        - route
        - fee
        - schedule
        - package
      properties:
        id:
          type: string
          description: Prefixed `qt_` id.
          examples:
            - qt_2bX9Wn4K
        available:
          type: boolean
          enum:
            - true
        livemode:
          type: boolean
        expires_at:
          type: string
          format: date-time
          description: A quote lasts 24 hours and books one delivery.
        service:
          $ref: '#/components/schemas/Service'
        route:
          $ref: '#/components/schemas/Route'
        fee:
          $ref: '#/components/schemas/Fee'
        schedule:
          $ref: '#/components/schemas/Schedule'
        package:
          $ref: '#/components/schemas/Package'
    QuoteUnavailable:
      type: object
      required:
        - available
        - reason
      properties:
        available:
          type: boolean
          enum:
            - false
        reason:
          type: object
          required:
            - code
            - message
          properties:
            code:
              $ref: '#/components/schemas/QuoteUnavailableReason'
            message:
              type: string
    QuoteUnavailableReason:
      type: string
      enum:
        - ADDRESS_NOT_FOUND
        - ADDRESS_NOT_SERVICEABLE
        - INTERSTATE_NOT_AVAILABLE
      description: >
        `ADDRESS_NOT_FOUND`: Reeds could not place an address at all: Google found nothing it trusts there, and Reeds
        knows neither the area nor the LGA you sent in that state. Check the spelling of `lga` and `state`, add or check
        the `area`, or send coordinates or a place id.

        `ADDRESS_NOT_SERVICEABLE`: Reeds doesn't pick up in the pickup's state, or doesn't deliver in the drop-off's
        state (or couldn't tell which state an address is in). `GET /coverage` lists the states it serves.

        `INTERSTATE_NOT_AVAILABLE`: the two addresses are in different states and Reeds has no price for that route.
        `GET /coverage` lists the routes it runs, under `interstate`.

        These are verdicts on the route. When Reeds can't measure the route at all right now (its maps service is
        unavailable), the request is not answered with a reason: it gets `503 SERVICE_UNAVAILABLE`. Retry shortly.
    QuoteEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Quote'
    QuoteUnavailableEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/QuoteUnavailable'
    Shipper:
      type: object
      description: >-
        Platform accounts only, and required for them (`422 SHIPPER_REQUIRED`); ignored on business accounts. The
        merchant the delivery is for: its name is what the receiver's text messages and the parcel label show.
      required:
        - business_name
        - phone
      properties:
        business_name:
          type: string
          examples:
            - Tola Fabrics
        phone:
          type: string
          examples:
            - '08051234567'
        merchant_id:
          type: string
          description: The platform's own id for this merchant.
          examples:
            - m_8812
    BookFromQuote:
      type: object
      title: BookFromQuote
      required:
        - quote_id
      properties:
        quote_id:
          type: string
          description: An unexpired, unused quote.
          examples:
            - qt_2bX9Wn4K
        ready:
          type: boolean
          default: true
          description: '`false` means the item is not packed yet; the delivery waits in `requires_action` until marked ready.'
        reference:
          type: string
          maxLength: 100
          description: Your order number, up to 100 characters. It does not have to be unique.
          examples:
            - ORDER-10045
        shipper:
          $ref: '#/components/schemas/Shipper'
        pickup_instructions:
          type: string
          maxLength: 500
          description: >-
            For this delivery only, up to 500 characters: the rider sees it before the address's own `notes`. Change it
            with `PATCH /deliveries/{id}`.
        dropoff_instructions:
          type: string
          maxLength: 500
          description: >-
            For this delivery only, up to 500 characters: the rider sees it before the address's own `notes`. Change it
            with `PATCH /deliveries/{id}`.
        metadata:
          $ref: '#/components/schemas/Metadata'
    DeliveryUpdate:
      type: object
      description: Only the fields to change. `null` clears a field; `metadata` replaces the whole object.
      properties:
        reference:
          type:
            - string
            - 'null'
          maxLength: 100
        pickup_instructions:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Until the rider has collected the parcel.
        dropoff_instructions:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Until the delivery is delivered.
        metadata:
          $ref: '#/components/schemas/Metadata'
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: A note saying why, up to 500 characters. Returned as `cancellation.note`.
          examples:
            - Customer cancelled the order
    DeliveryStatus:
      type: string
      description: >
        `requires_action` waits on you (see `required_actions`). `scheduled` is booked and charged (or added to the
        invoice). `rider_assigned` means a rider has the pickup.

        `picked_up` is collected. `at_hub` is at a Reeds hub (via-hub deliveries), or at the collecting or the receiving
        hub of an inter-state delivery, which passes `at_hub` twice. `in_transit` is moving between those two hubs, on
        an inter-state delivery only.

        `out_for_delivery` is with the rider heading to the receiver. `delivered` and `cancelled` are final.
        `failed_attempt` means the rider could

        not deliver; Reeds will retry or contact you. `on_hold` is paused by Reeds (see `hold_reason`). There is no
        `ready` status.
      enum:
        - requires_action
        - scheduled
        - rider_assigned
        - picked_up
        - at_hub
        - in_transit
        - out_for_delivery
        - delivered
        - failed_attempt
        - on_hold
        - cancelled
    RequiredActionType:
      type: string
      description: >
        `CONFIRM_PICKUP_ADDRESS` and `CONFIRM_DROPOFF_ADDRESS`: only on deliveries your team created in the dashboard;
        confirm the address there. A delivery booked through the API never needs it: its addresses were placed when it
        was quoted.

        `BOOK`: priced and waiting; call `POST /deliveries/{id}/book`. `FUND_WALLET`: auto-book is on but the wallet is
        short; fund it and Reeds retries.

        `PAY_INVOICE`: auto-book is on but the credit limit is reached; pay the invoice or ask Reeds to raise the limit.
        `MARK_READY`: call `POST /deliveries/{id}/ready`.

        `AWAITING_PRICE`: Reeds couldn't price the delivery yet because its maps service was unavailable. Nothing to do:
        it prices itself shortly, then the action becomes `BOOK` (or the delivery books itself when `auto_book` is on).
      enum:
        - CONFIRM_PICKUP_ADDRESS
        - CONFIRM_DROPOFF_ADDRESS
        - BOOK
        - FUND_WALLET
        - PAY_INVOICE
        - MARK_READY
        - AWAITING_PRICE
    RequiredAction:
      type: object
      required:
        - type
        - message
      properties:
        type:
          $ref: '#/components/schemas/RequiredActionType'
        address_id:
          type: string
          description: The stop's address id. Only on the confirm actions (dashboard deliveries).
        message:
          type: string
    CancellationReason:
      type: string
      description: >
        `business`: cancelled through the API or dashboard. `expired`: the 7-day rule. `processing_failed`: the delivery
        could not be set up within 30 minutes.

        `reeds`: cancelled by Reeds, with a note.
      enum:
        - business
        - expired
        - processing_failed
        - reeds
    Cancellation:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/CancellationReason'
        cancelled_by:
          type: string
          enum:
            - api
            - dashboard
            - reeds
            - system
          description: 'Who cancelled it: your API call, your team in the dashboard, Reeds operations, or Reeds automatically (expired, processing_failed).'
          examples:
            - api
        note:
          type:
            - string
            - 'null'
        refunded_amount:
          type: integer
          description: Amount refunded to the wallet or removed from the invoice, in kobo.
          examples:
            - 280000
        cancelled_at:
          type: string
          format: date-time
    Stop:
      type: object
      description: One end of the delivery. The address is the copy taken at booking.
      properties:
        address:
          type: object
          properties:
            id:
              type: string
            contact:
              $ref: '#/components/schemas/Contact'
            location:
              oneOf:
                - $ref: '#/components/schemas/Location'
                - type: 'null'
        instructions:
          type:
            - string
            - 'null'
          description: >-
            This delivery's instructions for the stop (`pickup_instructions` or `dropoff_instructions`), else the
            address's own `notes`.
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
    Event:
      type: object
      description: >-
        One line of the delivery's timeline: a status the delivery reached, and when. Only statuses are listed; Reeds'
        internal steps (creating, booking, marking ready, confirming an address, moving the delivery time) are not. A
        change of delivery time is announced with the `delivery.schedule_changed` webhook.
      properties:
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        at:
          type: string
          format: date-time
        note:
          type:
            - string
            - 'null'
    Delivery:
      type: object
      required:
        - id
        - livemode
        - channel
        - status
        - required_actions
        - cancellable
        - package
        - ready
        - auto_book
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Prefixed `dlv_` id.
          examples:
            - dlv_9Kd3Qx7M
        livemode:
          type: boolean
        channel:
          type: string
          enum:
            - direct
            - platform
            - store
          description: '`direct` for a business account, `platform` for a platform account, `store` for a Reeds store.'
        shipper:
          description: The merchant. `null` except on platform deliveries.
          oneOf:
            - $ref: '#/components/schemas/Shipper'
            - type: 'null'
        reference:
          type:
            - string
            - 'null'
          examples:
            - ORDER-10045
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        required_actions:
          type: array
          description: Only what is still outstanding. A completed action disappears and shows up in `events`.
          items:
            $ref: '#/components/schemas/RequiredAction'
        cancellable:
          type: boolean
          description: '`true` until the rider sets off for the pickup.'
        tracking_code:
          type:
            - string
            - 'null'
          description: The Reeds tracking id. `null` until the delivery is booked (a dashboard delivery still waiting to be booked).
          examples:
            - HQ3W5F2
        tracking_url:
          type:
            - string
            - 'null'
          examples:
            - https://getreeds.co/packages/HQ3W5F2
        service:
          oneOf:
            - $ref: '#/components/schemas/Service'
            - type: 'null'
        route:
          oneOf:
            - $ref: '#/components/schemas/Route'
            - type: 'null'
        pickup:
          $ref: '#/components/schemas/Stop'
        dropoff:
          $ref: '#/components/schemas/Stop'
        package:
          $ref: '#/components/schemas/Package'
        liability:
          $ref: '#/components/schemas/Liability'
        fee:
          description: '`null` until the delivery is priced.'
          oneOf:
            - $ref: '#/components/schemas/DeliveryFee'
            - type: 'null'
        schedule:
          description: '`null` until the delivery is booked and ready.'
          oneOf:
            - $ref: '#/components/schemas/Schedule'
            - type: 'null'
        ready:
          type: boolean
          description: Whether the item is packed.
        auto_book:
          type: boolean
        rider:
          type:
            - object
            - 'null'
          description: Set once a rider is assigned. First name only.
          properties:
            first_name:
              type: string
              examples:
                - Tunde
        hold_reason:
          type:
            - string
            - 'null'
          description: Why Reeds paused the delivery, when `status` is `on_hold`.
        cancellation:
          description: '`null` until the delivery is cancelled.'
          oneOf:
            - $ref: '#/components/schemas/Cancellation'
            - type: 'null'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time
        booked_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type: string
          format: date-time
    Liability:
      type: object
      description: What Reeds covers if the parcel is lost or damaged. Amounts in kobo.
      required:
        - covered_amount
        - cap
      properties:
        covered_amount:
          type: integer
          description: The declared value, up to `cap`; 0 when no value was declared.
          examples:
            - 4500000
        cap:
          type: integer
          description: The most Reeds covers for one delivery (₦50,000).
          examples:
            - 5000000
    DeliveryEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Delivery'
    DeliveryListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Delivery'
    AdvanceRequest:
      type: object
      description: Send `status` to move the delivery, or `deliver_by` with `reason` to simulate a schedule change.
      properties:
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        hold_reason:
          type: string
          description: With `status` `on_hold`.
        note:
          type: string
        deliver_by:
          type: string
          format: date-time
        reason:
          type: string
          description: With `deliver_by`.
    FundWalletRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          minimum: 100000
          maximum: 10000000000
          description: Amount in kobo, from NGN 1,000 (`100000`) to NGN 100,000,000 (`10000000000`).
          examples:
            - 5000000
    FundWalletResponse:
      type: object
      properties:
        amount:
          type: integer
          description: In kobo.
        currency:
          type: string
          enum:
            - NGN
        payment_url:
          type: string
          format: uri
          description: Open this Paystack page to pay.
        reference:
          type: string
          description: >-
            The payment's reference, `fund-` and 20 hexadecimal characters. `wallet.funded` carries it, so you can match
            the webhook to this top-up.
          examples:
            - fund-8f3a1c7e5b2d4a6f9e0c
    FundWalletEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FundWalletResponse'
    Wallet:
      type: object
      required:
        - balance
        - currency
        - billing_mode
      properties:
        livemode:
          type: boolean
        balance:
          type: integer
          description: In kobo.
          examples:
            - 4720000
        currency:
          type: string
          enum:
            - NGN
        billing_mode:
          type: string
          enum:
            - prepaid
            - invoice
          description: '`prepaid` debits the wallet at booking. `invoice` adds bookings to the month''s invoice.'
        low_balance_threshold:
          type:
            - integer
            - 'null'
          description: In kobo. The `wallet.low_balance` webhook fires at or below it.
        credit:
          type:
            - object
            - 'null'
          description: Invoice accounts only.
          properties:
            limit:
              type: integer
              description: In kobo.
            unbilled:
              type: integer
              description: Deliveries not yet invoiced, in kobo.
            unpaid_invoices:
              type: integer
              description: Issued invoices not yet paid, in kobo.
            available:
              type: integer
              description: '`limit` less `unbilled` and `unpaid_invoices`, in kobo.'
    WalletEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Wallet'
    WalletTransaction:
      type: object
      properties:
        id:
          type: string
          examples:
            - txn_Hd5Rw2Zx
        livemode:
          type: boolean
        type:
          type: string
          enum:
            - debit
            - credit
        amount:
          type: integer
          description: In kobo.
        currency:
          type: string
          enum:
            - NGN
        balance_after:
          type: integer
          description: In kobo.
        delivery_id:
          type:
            - string
            - 'null'
          description: The delivery the debit or refund belongs to.
        description:
          type: string
        created_at:
          type: string
          format: date-time
    WalletTransactionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/WalletTransaction'
    InvoiceStatus:
      type: string
      description: '`issued` is open; `overdue` is past its due date and unpaid; `void` was cancelled by Reeds and owes nothing.'
      enum:
        - issued
        - paid
        - overdue
        - void
    Invoice:
      type: object
      properties:
        id:
          type: string
          examples:
            - inv_6Gc4Yt8N
        number:
          type: string
          description: The invoice number, `RDS-<year>-<6 digits>` (`TEST-…` in test mode), numbered per mode and year with no gaps.
          examples:
            - RDS-2026-000123
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        period:
          type: string
          description: The month invoiced, `YYYY-MM`.
          examples:
            - 2026-09
        delivery_count:
          type: integer
        delivery_fees:
          type: integer
          description: In kobo.
        vat:
          type: integer
          description: VAT on the delivery fees only, in kobo.
        service_charges:
          type: integer
          description: In kobo. Carries no VAT.
        discounts:
          type: integer
          description: In kobo.
        adjustments:
          type: integer
          description: >
            In kobo, signed: credit notes and credit carried from an earlier invoice (negative), debit notes (positive).
            `delivery_fees + vat + service_charges - discounts + adjustments = total`.
        total:
          type: integer
          description: In kobo.
        amount_paid:
          type: integer
          description: In kobo.
        amount_credited:
          type: integer
          description: In kobo. Refunds and credit notes credited against this invoice after it was issued.
        amount_due:
          type: integer
          description: In kobo. `total - amount_paid - amount_credited`; 0 when paid or void.
        currency:
          type: string
          enum:
            - NGN
        issued_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        paid_at:
          type:
            - string
            - 'null'
          format: date-time
        voided_at:
          type:
            - string
            - 'null'
          format: date-time
    InvoiceEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Invoice'
    InvoiceListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Invoice'
    TestWebhookRequest:
      type: object
      properties:
        type:
          type: string
          description: The event type to send. Defaults to `delivery.status_changed`. Any other value is `422 INVALID_REQUEST`.
          enum:
            - delivery.created
            - delivery.requires_action
            - delivery.booked
            - delivery.status_changed
            - delivery.schedule_changed
            - delivery.expiring
            - delivery.cancelled
            - wallet.funded
            - wallet.low_balance
            - invoice.issued
            - invoice.paid
            - invoice.overdue
          examples:
            - delivery.status_changed
    TestWebhookEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                event_id:
                  type: string
                  description: The test event's own `evt_` id, as sent in `Reeds-Event-Id`.
                type:
                  type: string
                sent:
                  type: boolean
                  description: Whether your endpoint answered `2xx` within 10 seconds.
    WebhookEventBase:
      type: object
      required:
        - id
        - type
        - created_at
        - livemode
        - data
      properties:
        id:
          type: string
          description: Prefixed `evt_` id.
          examples:
            - evt_4fQ7Hd2X
        type:
          type: string
        created_at:
          type: string
          format: date-time
        livemode:
