      summary: Update a delivery
      description: >
        Changes `reference`, `pickup_instructions`, `dropoff_instructions` or `metadata`. An address cannot be changed
        through the API after

        booking; contact Reeds support, who can move it and charge or refund the price difference through your wallet.


        Send only the fields to change; `null` clears one. `metadata` replaces the whole object. The pickup instructions
        can change until the rider has collected the parcel, and the drop-off instructions until it is delivered (`409
        ACTION_NOT_ALLOWED` after that, and on a cancelled delivery). The rider sees the new text at once, also once the
        delivery is on its way. Sending an address, the package or another fixed field is `422 INVALID_REQUEST`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryUpdate'
            example:
              reference: ORDER-10045-B
              dropoff_instructions: Leave with the gateman
              metadata:
                store_id: '42'
                gift: 'true'
      responses:
        '200':
          description: The updated delivery.
