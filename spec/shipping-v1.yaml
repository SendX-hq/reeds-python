      summary: Top up the sandbox wallet
      description: >
        Credits the test-mode wallet instantly. The sandbox wallet starts at NGN 100,000 (`10000000` kobo). Only works
        with `rci_test_` credentials;

        live credentials get `403 TEST_MODE_ONLY`. Sandbox data is kept for 90 days.


        Dashboard deliveries waiting on `FUND_WALLET` are booked at once, oldest first, and `wallet.funded` fires, as after a live
        top-up. An `Idempotency-Key` header is optional here: a retry with the same key never credits twice. Invoice
        accounts have no wallet (`409 ACTION_NOT_ALLOWED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundWalletRequest'
            example:
              amount: 5000000
      responses:
        '200':
          description: The sandbox wallet after the top-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletEnvelope'
              example:
                status: success
                data:
                  livemode: false
                  balance: 15000000
                  currency: NGN
                  billing_mode: prepaid
                  low_balance_threshold: 1000000
                  credit: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The account is billed by invoice, so it has no wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: failed
                error:
                  code: ACTION_NOT_ALLOWED
                  message: This account is billed by invoice, so it has no wallet to top up.
                  doc_url: https://developer.getreeds.co/errors/ACTION_NOT_ALLOWED
                  fields: []
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
